# SPDX-License-Identifier: AGPL-3.0-only
#
# Hotel Reservations' own checks — beside `ci.yml`, which is the fleet's
# synced workflow (build, the suite, the manifest) and is never hand-edited.
#
# What only this repo needs, and why each is here:
#
#   the contract   `src/contract/contract.test.ts`: this repo's manifest and
#                  sample installed on a BUILT Adminium, with Invoices &
#                  Receipts, on SQLite, Postgres and MySQL — install, the
#                  sample at 09:05 on 28 July, every stay's money, the desk's
#                  counts, a guest's reservation through the public API, a
#                  check-in and a refused check-out, the sample removed. Here
#                  `ADMINIUM_REQUIRE_CONTRACT=1` runs it and makes a skip a
#                  failure, so it cannot go quietly green.
#   the update     `src/contract/update.test.ts`: the RELEASED package of the
#                  version in service (`FROM_VERSION`, fetched from the
#                  downloads host and held to RELEASES.json's integrity),
#                  installed on the Adminium it was released for (`FROM_REF`,
#                  a second build), that Adminium upgraded in place, and then
#                  this build applied: every row that was there, byte for byte.
#   the add-ons    codes, vouchers, gift cards and linen
#                  (`offers.test.ts`, `linen.test.ts`, `absent.test.ts`), with
#                  Inventory and Offers & gift cards packed from the add-ons
#                  release this version asks for (`ADD_ONS_REF`).
#   drift          the manifest validator this repo keeps a copy of, and the
#                  untranslated ledger — each fails when it no longer matches
#                  its source.
#   the builds     both hosted sides and the website's demo (`demo.json`).
#
# Both product checkouts are moved out of the workspace before the suite
# runs: vitest collects every `*.test.ts` under the repo root, and the
# products' own suites are not this repo's to run.

name: contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The Adminium release this version asks for, the add-ons release it was built against, and the release it updates.
  ADMINIUM_REF: v0.3.20
  ADD_ONS_REF: v1.0.10
  FROM_VERSION: 0.2.3
  FROM_REF: v0.3.9

jobs:
  contract:
    name: three-engine contract & drift
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out Adminium
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          ref: ${{ env.ADMINIUM_REF }}
          path: .adminium-product

      - name: Check out the Adminium the released version was made for
        uses: actions/checkout@v4
        with:
          repository: MoSofi/Adminium
          ref: ${{ env.FROM_REF }}
          path: .adminium-from

      - name: Check out the add-ons
        uses: actions/checkout@v4
        with:
          repository: Adminiumjs/add-ons
          ref: ${{ env.ADD_ONS_REF }}
          path: .add-ons

      # The e2e boot script serves the built server and the built dashboard, on
      # the engine it is asked for — the same composition `adminium start` runs.
      - name: Build Adminium (the server, the dashboard, the e2e boot)
        run: |
          cd .adminium-product
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Build the Adminium the released version was made for
        run: |
          cd .adminium-from
          corepack enable
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter="@adminium/e2e..."

      - name: Fetch the released package this version updates
        run: curl -fsSL "https://downloads.adminium.dev/apps/hotel/hotel-${FROM_VERSION}.tgz" -o "$RUNNER_TEMP/hotel-${FROM_VERSION}.tgz"

      - name: Build the add-ons
        run: |
          cd .add-ons
          npm ci
          npm run build

      - name: Move the checkouts out of the workspace
        run: |
          mv "$GITHUB_WORKSPACE/.adminium-product" "$RUNNER_TEMP/adminium-product"
          mv "$GITHUB_WORKSPACE/.adminium-from" "$RUNNER_TEMP/adminium-from"
          mv "$GITHUB_WORKSPACE/.add-ons" "$RUNNER_TEMP/add-ons"

      - name: Types
        run: npx tsc -b

      - name: The suite, with the contract on three engines
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
          ADD_ONS_REPO: ${{ runner.temp }}/add-ons
          ADMINIUM_REQUIRE_CONTRACT: "1"
          ADMINIUM_REQUIRE_VALIDATOR: "true"
          CONTRACT_FROM_ADMINIUM: ${{ runner.temp }}/adminium-from
          CONTRACT_FROM_TARBALL: ${{ runner.temp }}/hotel-${{ env.FROM_VERSION }}.tgz
          TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_MYSQL_URL: mysql://root@127.0.0.1:3306
        # One file at a time: each boots a server on every engine.
        run: npx vitest run --no-file-parallelism

      - name: The demo in a browser
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: The copies of other repos' files
        env:
          ADMINIUM_REPO: ${{ runner.temp }}/adminium-product
        run: |
          node scripts/sync-manifest-validator.mjs --check
          node scripts/untranslated.mjs --check

      - name: Both hosted sides, and the website's demo
        run: |
          npm run build:surface
          npm run build:demo
          test -f dist/demo.json
